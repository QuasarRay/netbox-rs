name: bootstrap-netbox-openapi

on:
  push:
    branches:
      - codex/rust-openapi-proto-pipeline

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: codex/rust-openapi-proto-pipeline
          fetch-depth: 0
          persist-credentials: true

      - name: Rust toolchain
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt

      - name: Validate Rust generator
        run: |
          cargo +1.98.0 fmt --check
          cargo +1.98.0 test --bin netbox_openapi_proto

      - name: Install protobuf compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Download exact NetBox OpenAPI snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p openapi
          curl --fail --location --retry 3 --retry-all-errors \
            "https://raw.githubusercontent.com/netbox-community/netbox/dbec965a5186a40971312c9331dfb9db46cc9183/contrib/openapi.json" \
            --output openapi/openapi.json

          version="$(jq -r '.info.version // "unknown"' openapi/openapi.json)"
          cat > openapi/SOURCE <<EOF
          repository=https://github.com/netbox-community/netbox.git
          commit=dbec965a5186a40971312c9331dfb9db46cc9183
          path=contrib/openapi.json
          openapi_version=${version}
          EOF

      - name: Regenerate protobufs with the Rust pipeline
        run: |
          cargo +1.98.0 run --bin netbox_openapi_proto -- \
            --input openapi/openapi.json \
            --output-dir proto/netbox \
            --package netbox.v1

      - name: Compile protobufs
        run: |
          protoc \
            --proto_path=proto/netbox \
            --proto_path=/usr/include \
            --descriptor_set_out="${RUNNER_TEMP}/netbox.pb" \
            proto/netbox/*.proto

      - name: Commit source snapshot and Rust-generated contracts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add openapi proto/netbox
          if git diff --cached --quiet; then
            echo "No bootstrap changes."
            exit 0
          fi
          git commit -m "Add pinned NetBox OpenAPI source and Rust-generated protobufs [skip ci]"
          git push origin HEAD:codex/rust-openapi-proto-pipeline
