[workspace]
members = ["macros"]
resolver = "2"

[package]
name = "netbox-rs"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
ciborium = "0.2"
netbox-rs-macros = { path = "macros" }
regress = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "=1.0.151"
summer = "=0.7.1"
summer-grpc = "=0.7.1"
uuid = { version = "1", features = ["serde"] }
