service CoreService {
  // GET /api/core/background-queues/ - Retrieve a list of RQ Queues. Note: Queue names are not URL safe, so not returning a detail view.
  rpc CoreBackgroundQueuesRetrieve (CoreBackgroundQueuesRetrieveRequest) returns (CoreBackgroundQueuesRetrieveResponse);
  // GET /api/core/background-queues/{name}/ - Retrieve a list of RQ Queues. Note: Queue names are not URL safe, so not returning a detail view.
  rpc CoreBackgroundQueuesRetrieveByName (CoreBackgroundQueuesRetrieveByNameRequest) returns (CoreBackgroundQueuesRetrieveByNameResponse);
  // GET /api/core/background-tasks/ - Retrieve a list of RQ Tasks.
  rpc CoreBackgroundTasksRetrieve (CoreBackgroundTasksRetrieveRequest) returns (CoreBackgroundTasksRetrieveResponse);
  // GET /api/core/background-tasks/{id}/ - Retrieve a list of RQ Tasks.
  rpc CoreBackgroundTasksRetrieveById (CoreBackgroundTasksRetrieveByIdRequest) returns (CoreBackgroundTasksRetrieveByIdResponse);
  // POST /api/core/background-tasks/{id}/delete/ - Retrieve a list of RQ Tasks.
  rpc CoreBackgroundTasksDeleteCreate (CoreBackgroundTasksDeleteCreateRequest) returns (BackgroundTask);
  // POST /api/core/background-tasks/{id}/enqueue/ - Retrieve a list of RQ Tasks.
  rpc CoreBackgroundTasksEnqueueCreate (CoreBackgroundTasksEnqueueCreateRequest) returns (BackgroundTask);
  // POST /api/core/background-tasks/{id}/requeue/ - Retrieve a list of RQ Tasks.
  rpc CoreBackgroundTasksRequeueCreate (CoreBackgroundTasksRequeueCreateRequest) returns (BackgroundTask);
  // POST /api/core/background-tasks/{id}/stop/ - Retrieve a list of RQ Tasks.
  rpc CoreBackgroundTasksStopCreate (CoreBackgroundTasksStopCreateRequest) returns (BackgroundTask);
  // GET /api/core/background-workers/ - Retrieve a list of RQ Workers.
  rpc CoreBackgroundWorkersRetrieve (CoreBackgroundWorkersRetrieveRequest) returns (CoreBackgroundWorkersRetrieveResponse);
  // GET /api/core/background-workers/{name}/ - Retrieve a list of RQ Workers.
  rpc CoreBackgroundWorkersRetrieveByName (CoreBackgroundWorkersRetrieveByNameRequest) returns (CoreBackgroundWorkersRetrieveByNameResponse);
  // GET /api/core/data-files/ - Get a list of data file objects.
  rpc CoreDataFilesList (CoreDataFilesListRequest) returns (PaginatedDataFileList);
  // GET /api/core/data-files/{id}/ - Get a data file object.
  rpc CoreDataFilesRetrieve (CoreDataFilesRetrieveRequest) returns (DataFile);
  // DELETE /api/core/data-sources/ - Delete a list of data source objects.
  rpc CoreDataSourcesBulkDestroy (CoreDataSourcesBulkDestroyRequest) returns (google.protobuf.Empty);
  // GET /api/core/data-sources/ - Get a list of data source objects.
  rpc CoreDataSourcesList (CoreDataSourcesListRequest) returns (PaginatedDataSourceList);
  // PATCH /api/core/data-sources/ - Patch a list of data source objects.
  rpc CoreDataSourcesBulkPartialUpdate (CoreDataSourcesBulkPartialUpdateRequest) returns (CoreDataSourcesBulkPartialUpdateResponse);
  // POST /api/core/data-sources/ - Post a list of data source objects.
  rpc CoreDataSourcesCreate (CoreDataSourcesCreateRequest) returns (DataSource);
  // PUT /api/core/data-sources/ - Put a list of data source objects.
  rpc CoreDataSourcesBulkUpdate (CoreDataSourcesBulkUpdateRequest) returns (CoreDataSourcesBulkUpdateResponse);
  // DELETE /api/core/data-sources/{id}/ - Delete a data source object.
  rpc CoreDataSourcesDestroy (CoreDataSourcesDestroyRequest) returns (google.protobuf.Empty);
  // GET /api/core/data-sources/{id}/ - Get a data source object.
  rpc CoreDataSourcesRetrieve (CoreDataSourcesRetrieveRequest) returns (DataSource);
  // PATCH /api/core/data-sources/{id}/ - Patch a data source object.
  rpc CoreDataSourcesPartialUpdate (CoreDataSourcesPartialUpdateRequest) returns (DataSource);
  // PUT /api/core/data-sources/{id}/ - Put a data source object.
  rpc CoreDataSourcesUpdate (CoreDataSourcesUpdateRequest) returns (DataSource);
  // POST /api/core/data-sources/{id}/sync/ - Enqueue a job to synchronize the DataSource.
  rpc CoreDataSourcesSyncCreate (CoreDataSourcesSyncCreateRequest) returns (DataSource);
  // GET /api/core/jobs/ - Retrieve a list of job results
  rpc CoreJobsList (CoreJobsListRequest) returns (PaginatedJobList);
  // GET /api/core/jobs/{id}/ - Retrieve a list of job results
  rpc CoreJobsRetrieve (CoreJobsRetrieveRequest) returns (Job);
  // GET /api/core/object-changes/ - Retrieve a list of recent changes.
  rpc CoreObjectChangesList (CoreObjectChangesListRequest) returns (PaginatedObjectChangeList);
  // GET /api/core/object-changes/{id}/ - Retrieve a list of recent changes.
  rpc CoreObjectChangesRetrieve (CoreObjectChangesRetrieveRequest) returns (ObjectChange);
  // GET /api/core/object-types/ - Read-only list of ObjectTypes.
  rpc CoreObjectTypesList (CoreObjectTypesListRequest) returns (PaginatedObjectTypeList);
  // GET /api/core/object-types/{id}/ - Read-only list of ObjectTypes.
  rpc CoreObjectTypesRetrieve (CoreObjectTypesRetrieveRequest) returns (ObjectType);
}
